<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세이크리드 픽셀 던전</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;  /* 테스트: 토스앱 네이티브 배경이 비치는지 확인 */
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            /* Safe Area 상단 - SafeAreaInsets API로 동적 설정 */
            padding-top: var(--safe-area-top, 0px);
        }

        /* 게임 영역 (나머지 공간) */
        #game-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* 배너 광고 영역 (상단, safe-area 아래) */
        #banner-ad {
            width: 100%;
            height: 96px;
            min-height: 96px;
            background-color: transparent;  /* 테스트: 토스앱 네이티브 배경이 비치는지 확인 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* GPU 가속: 모달 표시 시 깜빡임 방지를 위해 별도 레이어로 분리 */
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
    <!-- 앱인토스 플랫폼 마커 - iframe보다 먼저 설정되어야 함 -->
    <script>
        window.__APPSINTOSS__ = true;
        window.__LEADERBOARD_AVAILABLE__ = true;
        window.__USER_KEY_AVAILABLE__ = true;
        window.__CLOUD_SAVE_AVAILABLE__ = true;  // Firebase 초기화 후 실제 값으로 업데이트됨
    </script>
</head>
<body>
    <div id="app">
        <!-- 배너 광고 영역 (상단) -->
        <div id="banner-ad"></div>

        <!-- 게임 영역 -->
        <div id="game-container">
            <iframe id="game-frame" src="game/index.html" allow="fullscreen"></iframe>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
