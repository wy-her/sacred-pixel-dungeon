<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세이크리드 픽셀 던전</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 불투명이어야 한다. granite.config.ts의 navigationBar.transparentBackground = true라
               상태바 영역을 칠하던 네이티브 헤더(TopDefaultNavigation)가 사라졌고,
               transparent로 두면 WebView 자체의 기본 흰 바탕이 상태바 자리에 드러난다.
               (WebView를 투명하게 만드는 옵션은 webViewProps에 없다) */
            background-color: #18171C;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            /* Safe Area 상단 - SafeAreaInsets API로 동적 설정 */
            padding-top: var(--safe-area-top, 0px);
            /* padding-top 영역(= 상태바 자리)은 이 요소 자신의 배경으로 칠해진다.
               아래 #banner-ad와 같은 색이라 경계 없이 이어진다. */
            background-color: #18171C;
        }

        /* 게임 영역 (나머지 공간) */
        #game-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* 배너 광고 영역 (상단, safe-area 아래) */
        #banner-ad {
            width: 100%;
            height: 96px;
            min-height: 96px;
            background-color: #18171C;  /* dark theme grey 배경 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* GPU 가속: 모달 표시 시 깜빡임 방지를 위해 별도 레이어로 분리 */
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
    <!-- 앱인토스 플랫폼 마커 - iframe보다 먼저 설정되어야 함 -->
    <script>
        window.__APPSINTOSS__ = true;
        window.__LEADERBOARD_AVAILABLE__ = true;
        window.__USER_KEY_AVAILABLE__ = true;
        window.__CLOUD_SAVE_AVAILABLE__ = true;  // Firebase 초기화 후 실제 값으로 업데이트됨
    </script>
</head>
<body>
    <div id="app">
        <!-- 배너 광고 영역 (상단) -->
        <div id="banner-ad"></div>

        <!-- 게임 영역 -->
        <div id="game-container">
            <iframe id="game-frame" src="game/index.html" allow="fullscreen"></iframe>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
