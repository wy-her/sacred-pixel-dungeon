apply plugin: 'java-library'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

dependencies {
    api project(':SPD-classes')
    implementation project(':services')
}

// Load promotion config from local.properties
def tutorialCompleteCode = "DISABLED"
def tutorialCompleteAmount = 0
def tutorialStep1Code = "DISABLED"
def tutorialStep1Amount = 0
def tutorialStep2Code = "DISABLED"
def tutorialStep2Amount = 0
def tutorialStep3Code = "DISABLED"
def tutorialStep3Amount = 0
def tutorialEntryCode = "DISABLED"
def tutorialEntryAmount = 0
def thirdPlayCode = "DISABLED"
def thirdPlayAmount = 0
def streak10Code = "DISABLED"
def streak10Amount = 0
def streak30Code = "DISABLED"
def streak30Amount = 0
def allClassesCode = "DISABLED"
def allClassesAmount = 0
def jackOfAllTradesCode = "DISABLED"
def jackOfAllTradesAmount = 0
def champion1Code = "DISABLED"
def champion1Amount = 0
def champion2Code = "DISABLED"
def champion2Amount = 0
def champion3Code = "DISABLED"
def champion3Amount = 0
def takingTheMickCode = "DISABLED"
def takingTheMickAmount = 0

def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    def localProps = new Properties()
    localProps.load(new FileInputStream(localPropsFile))
    if (localProps.containsKey('promotion.tutorial.complete.code')) {
        tutorialCompleteCode = localProps.getProperty('promotion.tutorial.complete.code')
    }
    if (localProps.containsKey('promotion.tutorial.complete.amount')) {
        tutorialCompleteAmount = Integer.parseInt(localProps.getProperty('promotion.tutorial.complete.amount'))
    }
    if (localProps.containsKey('promotion.tutorial.step1.code')) {
        tutorialStep1Code = localProps.getProperty('promotion.tutorial.step1.code')
    }
    if (localProps.containsKey('promotion.tutorial.step1.amount')) {
        tutorialStep1Amount = Integer.parseInt(localProps.getProperty('promotion.tutorial.step1.amount'))
    }
    if (localProps.containsKey('promotion.tutorial.step2.code')) {
        tutorialStep2Code = localProps.getProperty('promotion.tutorial.step2.code')
    }
    if (localProps.containsKey('promotion.tutorial.step2.amount')) {
        tutorialStep2Amount = Integer.parseInt(localProps.getProperty('promotion.tutorial.step2.amount'))
    }
    if (localProps.containsKey('promotion.tutorial.step3.code')) {
        tutorialStep3Code = localProps.getProperty('promotion.tutorial.step3.code')
    }
    if (localProps.containsKey('promotion.tutorial.step3.amount')) {
        tutorialStep3Amount = Integer.parseInt(localProps.getProperty('promotion.tutorial.step3.amount'))
    }
    if (localProps.containsKey('promotion.tutorial.entry.code')) {
        tutorialEntryCode = localProps.getProperty('promotion.tutorial.entry.code')
    }
    if (localProps.containsKey('promotion.tutorial.entry.amount')) {
        tutorialEntryAmount = Integer.parseInt(localProps.getProperty('promotion.tutorial.entry.amount'))
    }
    if (localProps.containsKey('promotion.thirdplay.code')) {
        thirdPlayCode = localProps.getProperty('promotion.thirdplay.code')
    }
    if (localProps.containsKey('promotion.thirdplay.amount')) {
        thirdPlayAmount = Integer.parseInt(localProps.getProperty('promotion.thirdplay.amount'))
    }
    if (localProps.containsKey('promotion.streak10.code')) {
        streak10Code = localProps.getProperty('promotion.streak10.code')
    }
    if (localProps.containsKey('promotion.streak10.amount')) {
        streak10Amount = Integer.parseInt(localProps.getProperty('promotion.streak10.amount'))
    }
    if (localProps.containsKey('promotion.streak30.code')) {
        streak30Code = localProps.getProperty('promotion.streak30.code')
    }
    if (localProps.containsKey('promotion.streak30.amount')) {
        streak30Amount = Integer.parseInt(localProps.getProperty('promotion.streak30.amount'))
    }
    if (localProps.containsKey('promotion.allclasses.code')) {
        allClassesCode = localProps.getProperty('promotion.allclasses.code')
    }
    if (localProps.containsKey('promotion.allclasses.amount')) {
        allClassesAmount = Integer.parseInt(localProps.getProperty('promotion.allclasses.amount'))
    }
    if (localProps.containsKey('promotion.jackofalltrades.code')) {
        jackOfAllTradesCode = localProps.getProperty('promotion.jackofalltrades.code')
    }
    if (localProps.containsKey('promotion.jackofalltrades.amount')) {
        jackOfAllTradesAmount = Integer.parseInt(localProps.getProperty('promotion.jackofalltrades.amount'))
    }
    if (localProps.containsKey('promotion.champion1.code')) {
        champion1Code = localProps.getProperty('promotion.champion1.code')
    }
    if (localProps.containsKey('promotion.champion1.amount')) {
        champion1Amount = Integer.parseInt(localProps.getProperty('promotion.champion1.amount'))
    }
    if (localProps.containsKey('promotion.champion2.code')) {
        champion2Code = localProps.getProperty('promotion.champion2.code')
    }
    if (localProps.containsKey('promotion.champion2.amount')) {
        champion2Amount = Integer.parseInt(localProps.getProperty('promotion.champion2.amount'))
    }
    if (localProps.containsKey('promotion.champion3.code')) {
        champion3Code = localProps.getProperty('promotion.champion3.code')
    }
    if (localProps.containsKey('promotion.champion3.amount')) {
        champion3Amount = Integer.parseInt(localProps.getProperty('promotion.champion3.amount'))
    }
    if (localProps.containsKey('promotion.takingthemick.code')) {
        takingTheMickCode = localProps.getProperty('promotion.takingthemick.code')
    }
    if (localProps.containsKey('promotion.takingthemick.amount')) {
        takingTheMickAmount = Integer.parseInt(localProps.getProperty('promotion.takingthemick.amount'))
    }
}

// Generate PromotionConfig.java
def generatedSrcDir = file("$buildDir/generated/sources/promotion")

task generatePromotionConfig {
    outputs.dir generatedSrcDir
    doLast {
        def packageDir = file("$generatedSrcDir/com/sacredpixel/sacredpixeldungeon")
        packageDir.mkdirs()
        def configFile = file("$packageDir/PromotionConfig.java")
        configFile.text = """/*
 * AUTO-GENERATED FILE - DO NOT EDIT
 * Generated from local.properties during build
 */
package com.sacredpixel.sacredpixeldungeon;

public final class PromotionConfig {
    // Tutorial completion reward (test)
    public static final String TUTORIAL_COMPLETE_PROMO_CODE = "${tutorialCompleteCode}";
    public static final int TUTORIAL_COMPLETE_REWARD_AMOUNT = ${tutorialCompleteAmount};

    // Tutorial step 1 reward (guidebook pickup)
    public static final String TUTORIAL_STEP1_PROMO_CODE = "${tutorialStep1Code}";
    public static final int TUTORIAL_STEP1_REWARD_AMOUNT = ${tutorialStep1Amount};

    // Tutorial step 2 reward (rat killed)
    public static final String TUTORIAL_STEP2_PROMO_CODE = "${tutorialStep2Code}";
    public static final int TUTORIAL_STEP2_REWARD_AMOUNT = ${tutorialStep2Amount};

    // Tutorial step 3 reward (snake killed)
    public static final String TUTORIAL_STEP3_PROMO_CODE = "${tutorialStep3Code}";
    public static final int TUTORIAL_STEP3_REWARD_AMOUNT = ${tutorialStep3Amount};

    // Tutorial entry reward
    public static final String TUTORIAL_ENTRY_PROMO_CODE = "${tutorialEntryCode}";
    public static final int TUTORIAL_ENTRY_REWARD_AMOUNT = ${tutorialEntryAmount};

    // Third play reward
    public static final String THIRD_PLAY_PROMO_CODE = "${thirdPlayCode}";
    public static final int THIRD_PLAY_REWARD_AMOUNT = ${thirdPlayAmount};

    // 10-day streak reward
    public static final String STREAK_10_PROMO_CODE = "${streak10Code}";
    public static final int STREAK_10_REWARD_AMOUNT = ${streak10Amount};

    // 30-day streak reward
    public static final String STREAK_30_PROMO_CODE = "${streak30Code}";
    public static final int STREAK_30_REWARD_AMOUNT = ${streak30Amount};

    // All Classes Victory badge reward
    public static final String ALL_CLASSES_PROMO_CODE = "${allClassesCode}";
    public static final int ALL_CLASSES_REWARD_AMOUNT = ${allClassesAmount};

    // Jack of All Trades badge reward (BOSS_SLAIN_3_ALL_SUBCLASSES - 만물 박사)
    public static final String JACK_OF_ALL_TRADES_PROMO_CODE = "${jackOfAllTradesCode}";
    public static final int JACK_OF_ALL_TRADES_REWARD_AMOUNT = ${jackOfAllTradesAmount};

    // Champion 1 badge reward (Bronze - 1+ challenges)
    public static final String CHAMPION_1_PROMO_CODE = "${champion1Code}";
    public static final int CHAMPION_1_REWARD_AMOUNT = ${champion1Amount};

    // Champion 2 badge reward (Silver - 3+ challenges)
    public static final String CHAMPION_2_PROMO_CODE = "${champion2Code}";
    public static final int CHAMPION_2_REWARD_AMOUNT = ${champion2Amount};

    // Champion 3 badge reward (Gold - 6+ challenges)
    public static final String CHAMPION_3_PROMO_CODE = "${champion3Code}";
    public static final int CHAMPION_3_REWARD_AMOUNT = ${champion3Amount};

    // Taking the Mick badge reward
    public static final String TAKING_THE_MICK_PROMO_CODE = "${takingTheMickCode}";
    public static final int TAKING_THE_MICK_REWARD_AMOUNT = ${takingTheMickAmount};

    private PromotionConfig() {}
}
"""
    }
}

sourceSets.main.java.srcDirs += generatedSrcDir
compileJava.dependsOn generatePromotionConfig
